x-airflow-common:
  &airflow-common
  build: .
  restart: unless-stopped
  env_file:
    - ../.env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    TZ: Asia/Seoul  # KST 타임존 강제 설정
  volumes:
    - ./dags:/opt/airflow/dags
    - ../data:/opt/airflow/data
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # 1. Airflow 메타데이터 DB
  postgres-airflow:
    image: postgres:13
    restart: unless-stopped
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-airflow} -d $${POSTGRES_DB:-airflow}"]
      interval: 5s
      retries: 5

  # 2. 1회성 초기화 특공대
  airflow-init:
    <<: *airflow-common
    restart: "no" # 무한 재부팅 방지
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create 
      --username $$AIRFLOW_ADMIN_USER 
      --firstname Admin 
      --lastname User 
      --role Admin 
      --email admin@example.com 
      --password $$AIRFLOW_ADMIN_PASSWORD
      "

  # 3. Airflow 스케줄러
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 4. Airflow 웹서버
  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
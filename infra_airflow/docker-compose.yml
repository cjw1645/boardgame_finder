x-airflow-common:
  &airflow-common
  image: apache/airflow:2.9.0
  env_file:
    - ../.env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ../data:/opt/airflow/data
    - ./requirements.txt:/requirements.txt
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # 1. Airflow 메타데이터 DB
  postgres-airflow:
    image: postgres:13
    env_file:
      - ../.env
    healthcheck:
      # 컨테이너 안에서 $$를 사용해 .env의 변수를 불러옴
      test: ["CMD-SHELL", "pg_isready -U admin -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5

  # 2. 초기화 특공대 컨테이너
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      pip install -r /requirements.txt &&
      airflow db migrate &&
      airflow users create 
      --username $$AIRFLOW_ADMIN_USER 
      --firstname Admin 
      --lastname User 
      --role Admin 
      --email admin@example.com 
      --password $$AIRFLOW_ADMIN_PASSWORD
      "

  # 3. Airflow 스케줄러
  airflow-scheduler:
    <<: *airflow-common
    command: bash -c "pip install -r /requirements.txt && airflow scheduler"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 4. Airflow 웹서버
  airflow-webserver:
    <<: *airflow-common
    ports:
      - 8080:8080
    command: bash -c "pip install -r /requirements.txt && airflow webserver"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully